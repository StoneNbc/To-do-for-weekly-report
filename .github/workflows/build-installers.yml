name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build-macos:
    name: Build macOS universal
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      - name: Write checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-weekly-macos-universal
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:win
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-weekly-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30
